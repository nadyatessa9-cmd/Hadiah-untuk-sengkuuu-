    <script>
        const pages = [
            { avatar: "🎀", title: "🎁 Special Gift For You!", isLock: true },
            { avatar: "🥺", title: "🌷 PEMBUKA", text: "WOIII SENGGG 😭\n\nIya kamu. Jangan pura-pura nggak tahu. 😒😂\n\nAku ada sesuatu buat kamu... Sebenernya aku mau bikin yang keren, aesthetic, terus bikin kamu terharu. Tapi karena yang bikin aku... ya semoga nggak malu-maluin aja lah ya. 😭😂\n\nTapi ini beneran khusus buat kamu, Kevin Suyadi Ritonga 🤍 alias... Senggkuuu.\n\nJadi sebelum kamu buka... jangan ketawa dulu. Aku udah malu bikin beginian. 😭" },
            { avatar: "🎂", title: "🎂 23 SEPTEMBER", text: "HAPPY BIRTHDAY SENGGKUUU! 🤍\n\nSelamat ulang tahun yaa sayanggg. Nggak kerasa kamu udah tambah umur lagi. 😭\nTapi tenang... tambah umur bukan berarti tambah dewasa. 😭😂\nBercanda sengg, jangan marah. 🤣\n\nSemoga di umur kamu yang baru ini kamu makin sehat, makin kuat, rezekinya makin lancar, urusannya dimudahkan, dan semua yang lagi kamu usahain sekarang pelan-pelan bisa tercapai.\n\nSemoga kamu selalu punya alasan buat senyum. Semoga hari-hari kamu ke depannya lebih banyak baiknya daripada capeknya. Semoga kalau ada sesuatu yang kamu pengenin, satu-satu bisa kamu dapatkan. Dan semoga kamu selalu punya tenaga buat ngejar semua yang kamu impikan.\n\nWalaupun... jangan kerja terus sampai lupa aku. 😭 Aku kan juga butuh perhatian. 😒😂" },
            { avatar: "💌", title: "💌 AKU MAU NGOMONG SESUATU", text: "Sengg... Sebenernya aku nggak tahu harus mulai dari mana. Aku dari tadi mikir mau nulis apa buat kamu, tapi makin dipikir malah makin bingung. 😭 Banyak banget yang mau aku bilang. Tapi susah banget kalau harus dijadiin kata-kata.\n\nKarena kadang ada perasaan yang kalau cuma disimpan di hati rasanya penuh banget... Tapi pas mau diomongin malah cuma bisa bilang: “Aku sayang kamu.” Udah. 😭\n\nPadahal sebenernya masih banyak banget yang pengen aku bilang. Aku cuma mau kamu tahu... aku seneng banget bisa kenal kamu. Sesimpel itu. Aku seneng pernah ketemu kamu. Seneng bisa ngobrol sama kamu. Seneng bisa punya seseorang yang bisa aku cari kalau aku lagi pengen cerita. Seneng bisa punya seseorang yang tiba-tiba bikin aku senyum cuma gara-gara satu chat.\n\nDan yang paling lucu... Aku sendiri nggak tahu kapan tepatnya aku mulai sesayang ini sama kamu. Kita juga nggak punya tanggal yang jelas kan? 😭 Tiba-tiba udah manggil sengg. Tiba-tiba udah saling perhatian. Tiba-tiba udah saling nungguin. Tiba-tiba udah jadi tempat cerita. Dan tiba-tiba... aku takut kehilangan kamu. 🥹" },
            { avatar: "🧸", title: "🥺 TENTANG AWAL KITA", text: "Kalau dipikir-pikir lagi... Lucu juga ya kita. Kita nggak punya cerita awal yang terlalu jelas. Nggak ada tanggal yang benar-benar kita ingat. Nggak ada momen: “Pada hari ini, pukul sekian, kita resmi menjadi pasangan.” NGGAK ADA. 😭😂\n\nTahu-tahu udah saling manggil sengg. Tahu-tahu udah nyaman. Tahu-tahu udah saling cari kalau nggak ngobrol. Tahu-tahu udah jadi bagian dari hari masing-masing. Dan tahu-tahu... aku udah sayang banget sama kamu.\n\nKadang aku suka mikir... kok bisa ya? Kok orang yang awalnya mungkin cuma orang biasa yang aku kenal... pelan-pelan malah jadi orang yang keberadaannya penting banget buat aku.\n\nSampai kalau kamu nggak ada kabar... aku bisa mikir macam-macam. 😭 Padahal mungkin kamu cuma lagi makan. 😭😂\nTapi ya begitulah... kalau udah sayang, otak suka nggak diajak kerja sama." },
            { avatar: "🌙", title: "🌙 KALAU NANTI KAMU CAPEK", text: "Sengg... Nanti kalau kamu udah mulai kerja dan hidup kamu makin sibuk... kalau nanti kamu capek... kalau nanti kamu pulang kerja rasanya udah nggak punya tenaga buat ngapa-ngapain... aku harap kamu tetap inget kalau ada aku.\n\nAku mungkin nggak bisa selalu ada di samping kamu secara langsung. Aku juga mungkin nggak bisa bantu banyak. Kadang paling banter aku cuma bisa bilang: “Sengg, semangat yaa.” 😭 Tapi aku serius waktu bilang itu. Aku beneran pengen kamu baik-baik aja. Aku pengen kamu berhasil. Aku pengen kamu punya kehidupan yang kamu mau. Aku pengen lihat kamu suatu hari nanti bisa bilang: “Akhirnya aku berhasil.” Dan aku pengen jadi salah satu orang yang ikut senang waktu kamu ngomong itu.\n\nKalau nanti kamu lagi capek... nggak apa-apa. Kalau nanti kamu lagi takut... nggak apa-apa. Kalau nanti kamu lagi bingung... nggak apa-apa. Kamu nggak harus selalu kuat. Kalau kamu mau cerita, cerita aja. Kalau kamu mau diam, aku temenin.\n\nKalau kamu cuma butuh seseorang yang bilang: “Ayo sengg, kita jalan lagi pelan-pelan.” Aku mau jadi orang itu. Walaupun mungkin setelah kamu cerita panjang lebar... aku cuma bisa jawab: “Iya sengg, aku ngerti...” Padahal dalam hati: “Aku juga bingung harus jawab apa. 😭” 😂😭\n\nTapi setidaknya... kamu nggak sendirian." },
            { avatar: "☁️", title: "🤍 AKU NGGAK MINTA KAMU SEMPURNA", text: "Aku nggak butuh kamu jadi orang yang sempurna. Aku nggak butuh kamu selalu tahu harus ngapain. Aku nggak butuh kamu selalu kuat. Aku juga nggak mau kamu ngerasa harus selalu terlihat baik-baik aja di depan aku.\n\nKalau capek, bilang capek. Kalau sedih, bilang sedih. Kalau takut, bilang takut. Kalau lagi banyak pikiran... cerita aja. Nggak harus selalu ada solusi. Kadang kita cuma butuh seseorang yang mau dengerin.\n\nDan kalau kamu butuh itu... aku mau jadi orangnya. Aku mungkin nggak selalu punya jawaban. Kadang aku malah ikut bingung. 😭😂 Tapi aku bisa dengerin. Aku bisa nemenin. Aku bisa bilang: “Udah sengg, pelan-pelan aja.”\n\nDan kalau memang hari itu berat banget... yaudah. Kita istirahat dulu. Besok baru lanjut lagi. Aku nggak mau kamu merasa harus menghadapi semuanya sendirian. 🥹" },
            { avatar: "⭐", title: "🥹 TENTANG MIMPI KAMU", text: "Aku pengen banget lihat kamu berhasil. Bukan cuma karena aku pacar kamu. Tapi karena aku tahu kamu juga punya mimpi. Punya keinginan. Punya kehidupan yang pengen kamu bangun.\n\nAku tahu mungkin nggak semuanya gampang. Mungkin ada banyak hal yang harus kamu korbankan. Mungkin ada banyak capek yang harus kamu lewatin. Tapi aku harap... jangan berhenti percaya sama diri kamu sendiri.\n\nKalau nanti ada hari di mana kamu ngerasa: “Kayaknya aku nggak bisa deh...” Aku pengen kamu inget... aku percaya kamu bisa. Bahkan kalau saat itu kamu sendiri lagi nggak percaya sama diri kamu. Aku percaya.\n\nAku pengen lihat kamu berhasil. Aku pengen lihat kamu punya kehidupan yang kamu impikan. Dan nanti kalau kamu udah berhasil... aku mungkin bakal jadi orang yang paling sering bilang: “Tuh kan sengg, aku bilang juga apa.” 😭😂 Padahal dari dulu juga mungkin aku nggak pernah bilang. 😭" },
            { avatar: "📸", title: "📸 SATU MASALAH BESAR KITA", text: "Tapi ada satu hal yang sampai sekarang masih mengganggu pikiranku... KITA BELUM PUNYA FOTO BERDUA. 😭😭😭 HAHAHAHAHA. Ini pacaran apa hubungan LDR sama KTP sih? 😭😂\n\nTapi gapapa. Berarti masih ada satu momen yang belum kita punya. Foto pertama kita. Dan aku nggak peduli nanti fotonya aesthetic atau malah muka kita sama-sama aneh. Mau rambut berantakan. Mau muka lagi jelek. Mau senyum nggak jelas. Yang penting ada kamu dan aku di satu frame. 🤍\n\nAku pengen suatu hari nanti kita punya banyak foto. Banyak banget. Sampai nanti galeri HP penuh sama foto kita. Terus kamu protes: “Sengg, hapus sebagian dong.” Aku: “NGGAK MAU.” 😭😂\n\nTerus nanti kalau beberapa tahun lagi kita lihat website ini... kita bisa ketawa sambil bilang: “Dulu kita bahkan belum punya foto berdua.” Dan mungkin saat itu... kita udah punya begitu banyak cerita yang nggak pernah kita bayangin sebelumnya. 🥹🤍" },
            { avatar: "🪐", title: "💭 TENTANG MASA DEPAN KITA", text: "Sengg... Aku tahu perjalanan kita ke depan masih panjang. Kamu punya rencana kamu. Aku juga punya rencana aku. Kita sama-sama pengen punya kehidupan yang lebih baik.\n\nMungkin nanti ada masa kita sama-sama sibuk. Ada masa kita jauh. Ada masa kita capek. Ada masa kita mungkin nggak punya banyak waktu buat ngobrol. Tapi aku berharap... kita tetap saling ngerti.\n\nKalau salah satu lagi capek, jangan malah menjauh. Kalau ada masalah, jangan langsung menyerah. Kalau lagi susah, jangan merasa harus menghadapi semuanya sendirian.\n\nAku pengen kita sama-sama belajar. Sama-sama tumbuh. Sama-sama berusaha. Sama-sama ngejar mimpi. Dan kalau suatu hari nanti kita berhasil sampai ke kehidupan yang kita impikan... aku pengen kita bisa nengok ke belakang dan bilang: “Gila ya... ternyata kita bisa sampai sejauh ini.” 🥹🤍\n\nAku nggak tahu nanti kita bakal sampai sejauh apa. Aku nggak tahu semuanya bakal sesuai rencana atau nggak. Tapi aku berharap... kalau memang kita sama-sama masih mau, kita tetap jalan bareng. Pelan-pelan aja. Nggak harus buru-buru. Yang penting... jangan saling lepas." },
            { avatar: "💼", title: "😂 PROYEK BESAR KITA", text: "Nah... Sekarang kita masuk ke bagian yang sangat penting. 😭 Sengg harus rajin kerja yaa. Jangan malas-malasan. Karena ada satu proyek besar yang harus kita siapkan. 👀\n\nAku kasih clue:\n6 huruf. Depannya S. Belakangnya T. Apa hayo? 👀\n... ...\n<span class='sinamot-highlight'>SINAMOT! 😭😭😭😂❤️</span>\nWKWKWKWK.\n\nJadi kalau nanti kamu capek kerja, inget aja: “Aku kerja bukan cuma buat diri sendiri... ada masa depan yang harus dibiayai.” 😭😂 Bercanda sengg. Jangan langsung stres. 🤣\n\nTapi sebenernya... aku berharap banget suatu hari nanti candaan ini nggak cuma jadi candaan. Semoga suatu hari nanti kita beneran sampai ke tahap itu. Bukan cuma ngomong: “Nanti kalau udah...” Tapi beneran bisa bilang: “Akhirnya kita sampai juga.” 🥹🤍\n\nDan kalau hari itu datang... aku rasa aku bakal nangis. Bukan karena sinamotnya. 😭😂 Tapi karena aku bakal inget... dulu kita pernah ada di masa di mana semuanya masih berupa rencana. Masih berupa mimpi. Masih berupa obrolan kecil. Masih berupa: “Kalau nanti...” Dan ternyata... kita beneran bisa sampai." },
            { avatar: "☕", title: "🌧️ KALAU SUATU HARI NANTI", text: "Sengg... Kalau suatu hari nanti kamu lagi ngerasa hidup kamu nggak sesuai yang kamu harapkan... tolong jangan langsung merasa kamu gagal. Karena aku tahu kamu udah berusaha. Mungkin hasilnya belum kelihatan sekarang. Mungkin kamu belum punya semua yang kamu mau. Mungkin masih banyak yang harus dikejar. Tapi bukan berarti kamu nggak maju.\n\nKadang kita cuma terlalu sibuk melihat apa yang belum kita punya... sampai lupa melihat seberapa jauh kita udah berjalan.\n\nJadi kalau nanti kamu lagi capek... berhenti sebentar gapapa. Tarik napas. Istirahat. Nangis kalau memang mau nangis. Nggak usah sok kuat terus. Setelah itu... ayo jalan lagi. Pelan-pelan aja.\n\nAku juga nggak akan maksa kamu harus selalu kuat. Aku cuma mau kamu jangan menyerah sama diri kamu sendiri. Karena aku... masih pengen lihat kamu berhasil. 🥺" },
            { avatar: "🕰️", title: "🥺 KALAU NANTI KITA SUDAH TUA", text: "Ini mungkin kedengerannya jauh banget... Tapi kadang aku suka mikir. Gimana ya kalau nanti kita udah tua? 😭\n\nKita mungkin bakal lupa banyak hal tentang masa sekarang. Mungkin lupa chat pertama. Mungkin lupa siapa yang duluan perhatian. Mungkin lupa kapan mulai saling manggil sengg. Walaupun jelas kamu yang duluan. 😭😂 Tapi aku berharap kita nggak lupa sama masa ini.\n\nMasa ketika kita masih muda. Masih sama-sama belajar. Masih sama-sama berusaha. Masih sama-sama punya banyak mimpi. Masih sama-sama bilang: “Nanti kalau udah...”\n\nAku pengen suatu hari nanti kita bisa duduk bareng... terus lihat kembali semua cerita lama. Lihat foto pertama kita. Lihat website ini. Terus ketawa karena ternyata dulu kita masih polos banget. 😭😂\n\nDan mungkin saat itu aku bakal diem sebentar... terus lihat kamu... dan mikir: “Gila... ternyata orang yang dulu cuma bisa aku panggil lewat chat, sekarang beneran duduk di sebelah aku.” 🥹🤍 Aku rasa itu bakal jadi salah satu hal paling indah yang bisa aku rasain." },
            { avatar: "💌", title: "🤍 AKU SAYANG KAMU YANG SEKARANG", text: "Sengg... Aku nggak cuma sayang sama kamu yang nanti udah sukses. Aku nggak cuma sayang sama kamu yang nanti udah punya banyak uang. Aku nggak cuma sayang sama kamu kalau hidup kamu lagi baik-baik aja.\n\nAku sayang sama kamu yang sekarang. Yang masih berjuang. Yang masih belajar. Yang masih capek. Yang masih kadang bingung. Yang masih punya banyak kekurangan. Yang mungkin kadang bikin aku kesel. 😭😂\n\nAku sayang sama kamu yang sekarang. Karena kamu nggak harus jadi versi terbaik kamu dulu supaya pantas disayang. Buat aku, kamu yang sekarang juga sudah cukup.\n\nDan kalau nanti kamu berubah jadi lebih baik... aku bakal senang. Kalau nanti kamu berhasil... aku bakal bangga. Kalau nanti kamu jatuh... aku tetap mau nemenin kamu bangun lagi.\n\nKarena aku nggak pengen cuma ada di bagian cerita kamu yang enak-enaknya aja. Aku pengen... kalau boleh, aku juga ada di bagian yang susah. 🥹🤍" },
            { avatar: "💌", title: "😭 PESAN TERAKHIR", text: "Okeee sengg... Ini beneran yang terakhir. Aku cuma mau bilang... Selamat ulang tahun, senggkuuu. 🎂🤍\n\nMakasih udah lahir. Makasih udah hadir. Makasih udah jadi bagian dari hidup aku. Makasih udah mau dengerin cerita aku. Makasih udah sabar sama aku. Makasih udah tetap ada. Dan makasih... karena sampai sekarang... masih mau sama aku. 😭❤️\n\nAku nggak tahu nanti cerita kita bakal seperti apa. Aku nggak bisa janji semuanya akan selalu gampang. Aku nggak bisa janji kita nggak akan pernah berantem. Aku nggak bisa janji nggak akan ada hari di mana kita sama-sama capek.\n\nTapi aku bisa bilang satu hal... Kalau kamu masih mau, aku juga masih mau. Aku mau terus belajar kenal kamu. Mau terus dengar cerita kamu. Mau lihat kamu berkembang. Mau lihat kamu berhasil. Mau ketawa bareng kamu. Mau marah-marah kecil sama kamu. 😭 Mau bikin kamu kesel. Mau kamu bikin aku kesel. Terus lima menit kemudian: “Sengg...” 😭😂 Begitulah kira-kira hubungan kita. 🤣❤️" },
            { avatar: "🌷", title: "🌷 ENDING", text: "Senggkuuu...\nKalau suatu hari nanti kamu lupa betapa berharganya diri kamu... buka lagi website ini. Baca lagi semua yang aku tulis. Karena mungkin nanti aku nggak selalu bisa ngomong semuanya secara langsung. Tapi setidaknya... kata-kata ini pernah aku tulis buat kamu. Dengan perasaan yang beneran. 🥹🤍\n\nDan kalau suatu hari nanti kita benar-benar sampai di tempat yang sekarang cuma bisa kita bayangin... aku pengen lihat kamu. Terus aku pengen bilang: “Sengg... kita berhasil.” Dan mungkin aku bakal nangis. Kamu juga boleh nangis. Tapi kalau kamu nangis duluan... aku screenshot dulu. 😭😭😭😂❤️ Biar ada bukti.\n\nTapi serius... Aku nggak tahu seberapa jauh perjalanan kita nanti. Aku nggak tahu apa yang bakal terjadi. Aku nggak tahu apakah semua rencana kita bakal berjalan sesuai yang kita mau. Tapi kalau sekarang aku dikasih pilihan... Kalau aku bisa mengulang semuanya dari awal... Kalau aku bisa kembali ke saat kita belum saling kenal... dan seseorang bilang: “Nanti kamu bakal sayang banget sama orang ini. Tapi perjalanan kalian juga nggak selalu gampang.” Aku tetap bakal bilang: “Yaudah. Aku tetap mau kenal dia.” Karena ternyata... kenal kamu adalah salah satu hal yang aku syukuri.\n\nDan kalau nanti kita harus melewati banyak hal untuk sampai ke tujuan... yaudah. Kita lewatin pelan-pelan. Nggak harus sempurna. Nggak harus selalu gampang. Yang penting... kita masih saling pilih. 🥹🤍\n\nJadi... selamat ulang tahun yaa senggkuuu. Semoga panjang umur. Semoga sehat selalu. Semoga rezekimu lancar. Semoga kerja kerasmu dibalas dengan hasil yang baik. Semoga semua impian kamu tercapai. Semoga tabungan kamu cepat terkumpul... KARENA SINAMOT KITA MENUNGGU. 😭😭😭😂❤️\n\nDan semoga... di antara semua hal yang kamu perjuangkan untuk masa depanmu... aku masih menjadi salah satu hal yang ingin kamu perjuangkan. 🥹🤍\n\nAku sayang kamu. Banyak banget. Dan kalau suatu hari nanti kamu tanya: “Sengg, kamu masih pilih aku?” Jawabanku tetap         let currentIndex = 0;

        function renderPage(index) {
            const page = pages[index]; 
            const box = document.getElementById('content-box');
            let html = `<div class="cartoon-avatar">${page.avatar}</div><h3>${page.title}</h3>`;
            
            if (page.isLock) { 
                html += `
                    <div class="gift-box" onclick="this.style.transform='scale(1.15)'; setTimeout(()=>this.style.transform='scale(1)', 200)">🎁</div>
                    <div class="pin-box">PIN: 111111</div>
                    <input type="password" id="passcode" placeholder="Masukkan PIN 111111"><br>
                    <button onclick="checkPassword()">Buka Kado 🤍</button>
                `; 
            } else { 
                html += `<div class="story-text">${page.text}</div>`;
                html += `<div class="nav-buttons">`;
                html += index > 1 ? `<button onclick="changePage(-1)">← Kembali</button>` : `<div></div>`;
                html += !page.isEnd ? `<button onclick="changePage(1)">Lanjut →</button>` : `<div></div>`;
                html += `</div>`; 
            }
            box.innerHTML = html; 
            window.scrollTo(0, 0);
        }

        function checkPassword() { 
            const val = document.getElementById('passcode').value;
            if (val === '111111') { 
                currentIndex = 1; 
                renderPage(currentIndex); 
                document.getElementById('bg-music').play().catch(()=>{});
            } else { 
                alert('PIN salah sengg! Masukkan 111111 yaa 💜'); 
            } 
        }

        function changePage(dir) { 
            currentIndex += dir; 
            renderPage(currentIndex); 
        }

        renderPage(0);

        setInterval(() => { 
            const p = document.createElement('div'); 
            p.className = 'petal'; 
            p.innerHTML = ['🌸','🤍','✨','🌷','💖'][Math.floor(Math.random()*5)]; 
            p.style.left = Math.random() * 100 + 'vw'; 
            document.body.appendChild(p); 
            setTimeout(() => p.remove(), 5000); 
        }, 900);
    </script>
